name: CI

# รัน 2 ทาง:
#  1) ทุก PR / commit ที่ไม่ใช่ main -> รันตัวเอง
#  2) เมื่อ deploy.yml เรียกเป็น reusable workflow -> เป็นด่านก่อนขึ้น prod
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (ใช้ lockfile เท่านั้น — fail ถ้า package.json เปลี่ยนแต่ lock ไม่ตาม)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
