name: Deploy

# deploy เฉพาะเมื่อ job quality ผ่าน (needs) — โค้ดพังจะไม่ถูกส่งขึ้น prod
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ci.yml มี workflow_call อยู่ จึงเรียกมาใช้เป็นด่านตรวจได้
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: production
    env:
      # อ่านจาก repo secrets หรือ environment "production" secrets ก็ได้
      # ถ้าใส่ผิดที่ไปอยู่ tab "Variables" ตัวนี้จะว่าง แล้ว step แรกจะหยุดพร้อมข้อความบอกสาเหตุ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required secrets are present
        env:
          NAMES: VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
        run: |
          missing=""
          for n in $NAMES; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — ใส่ใน GitHub → repo → Settings → Secrets and variables → Actions → tab 'Secrets' (ไม่ใช่ tab 'Variables')"
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
